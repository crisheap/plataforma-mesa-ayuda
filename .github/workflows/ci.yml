name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Tipos y pruebas unitarias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Valor ficticio: prisma generate y las pruebas unitarias no se conectan a la base de datos.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run prisma:generate
      - run: npm run typecheck
      - name: Análisis estático y formato (Biome)
        run: npm run check
      - run: npm test

  integracion:
    name: Integración con PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mesa
          POSTGRES_PASSWORD: mesa
          POSTGRES_DB: mesa_ayuda
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mesa -d mesa_ayuda"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://mesa:mesa@localhost:5432/mesa_ayuda?schema=public
      JWT_SECRET: secreto-de-integracion-continua-con-mas-de-32-caracteres
      ADMIN_EMAIL: admin@mesaayuda.local
      ADMIN_INITIAL_PASSWORD: Admin#2026Ci!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run prisma:generate
      - name: Migraciones
        run: npm run prisma:migrate
      - name: Datos iniciales
        run: npm run db:seed
      - name: Flujo completo contra la base de datos
        run: npm run test:integracion

  docker:
    name: Docker, respaldos, carga, accesibilidad y Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba
        run: |
          cp .env.docker.example .env
          sed -i 's|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=clave-docker-ci|' .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i 's|^ADMIN_INITIAL_PASSWORD=.*|ADMIN_INITIAL_PASSWORD=Admin#2026Docker!|' .env
          sed -i 's|^CORS_ORIGINS=.*|CORS_ORIGINS=http://localhost:4000|' .env
          {
            echo "METRICS_TOKEN=token-metricas-ci"
            echo "RATE_LIMIT_API_MIN=100000"
            echo "LOG_PETICIONES=json"
          } >> .env
      - name: Construir y levantar
        run: docker compose up -d --build
      - name: Esperar a la API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:4000/api/health?deep=1" | grep -q '"db":"ok"'; then echo "API lista"; exit 0; fi
            sleep 3
          done
          echo "La API no respondió a tiempo"; exit 1
      - name: Verificar PWA e inicio de sesión
        run: |
          curl -fsS http://localhost:4000/ | grep -q "<html"
          curl -fsS http://localhost:4000/manifest.webmanifest | grep -q '"display"'
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "content-type: application/json" \
            -d '{"correo":"admin@mesaayuda.local","password":"Admin#2026Docker!"}' http://localhost:4000/api/auth/login)
          test "$code" = "200"
      - name: Documentación de la API
        run: |
          curl -fsS http://localhost:4000/api/openapi.json | grep -q '"openapi":"3.1.0"'
          curl -fsS http://localhost:4000/api/docs | grep -q "swagger-ui"

      - name: Respaldo y restauración (RNF-08)
        run: |
          docker compose --profile respaldos run --rm -e RESPALDO_UNA_VEZ=true respaldos
          archivo=$(ls respaldos | grep '\.dump$' | head -1)
          test -s "respaldos/$archivo"
          docker compose exec -T db createdb -U mesa restaurada
          docker compose --profile respaldos run --rm -e PGDATABASE=restaurada --entrypoint sh respaldos /scripts/restaurar.sh "/respaldos/$archivo"
          usuarios=$(docker compose exec -T db psql -U mesa -d restaurada -tAc 'SELECT count(*) FROM usuarios')
          echo "Usuarios en la base restaurada: $usuarios"
          test "$usuarios" -ge 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias para las pruebas web
        working-directory: backend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Preparar datos de prueba
        env:
          ADMIN_INITIAL_PASSWORD: Admin#2026Docker!
        run: node carga/preparar.mjs > credenciales.json

      - uses: grafana/setup-k6-action@v1
      - name: Prueba de carga con k6 (RNF-04, p95 ≤ 3 s)
        run: |
          k6 run -e BASE_URL=http://localhost:4000 -e VUS=25 -e DURACION=40s \
            -e CORREO="$(jq -r .usuario.correo credenciales.json)" -e PASSWORD="$(jq -r .usuario.password credenciales.json)" \
            --summary-export=carga-resumen.json carga/escenario.js

      - name: Métricas después de la carga (RNF-14)
        run: |
          curl -fsS -H "Authorization: Bearer token-metricas-ci" http://localhost:4000/api/metrics > metricas.txt
          grep -E '^mesa_http_peticiones_total\{metodo="GET",ruta="/api/casos/mis-casos",estado="200"\}' metricas.txt
          grep -E '^mesa_db_disponible 1' metricas.txt
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/metrics)" = "401"

      - name: Accesibilidad (axe) y PWA con Playwright (RNF-10, RNF-11)
        working-directory: backend
        env:
          CREDENCIALES: ../credenciales.json
        run: npx playwright test

      - name: Lighthouse (RNF-04, RNF-10)
        run: npx --yes @lhci/cli@0.15.x autorun --config=lighthouserc.json

      - name: Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-calidad
          path: |
            backend/playwright-report
            lighthouse
            carga-resumen.json
            metricas.txt
          if-no-files-found: ignore

      - name: Registros en caso de fallo
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v
